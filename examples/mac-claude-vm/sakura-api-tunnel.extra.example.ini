; Merge only into the one approved tunnel section of a private static frpc.ini.
; This fragment has no account, node or allocated remote port; do not run it alone.
; Keep the complete private configuration 0600 under a 0700 directory.
; Start with -c, without --fetch_config or NATFRP_TARGET.
; Preserve Host; configure the exact public hostname:port in the gateway's
; additionalPublicAuthorities. The gateway then rejects unlisted authorities.
type = tcp
local_ip = 127.0.0.1
local_port = 43158
auto_https = auto
auto_https_mode = http
auto_https_policy = strict
; This client version returned 421 for correct requests with this check enabled.
; Use strict certificate selection and the gateway authority whitelist instead.
auto_https_verify_client = false
local_access = false
use_compression = false
